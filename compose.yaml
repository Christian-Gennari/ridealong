# Started by the ridealong command, which fills these in from
# ~/.config/ridealong/config.env.
name: ridealong
services:
  ridealong:
    container_name: ${RIDEALONG_NAME:-ridealong}
    image: ${RIDEALONG_IMAGE:-ghcr.io/christian-gennari/ridealong:latest}
    build:
      context: .
      args:
        VERSION: ${RIDEALONG_VERSION:-dev}
        BUILT: ${RIDEALONG_BUILT:-0}
        REFRESH: ${RIDEALONG_REFRESH:-0}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

    # Brave's own sandbox needs user namespaces (docker/seccomp.json) and chroot.
    # Everything else Docker would allow is taken away.
    user: ${RIDEALONG_UID}:${RIDEALONG_GID}
    read_only: true
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp:docker/seccomp.json
    shm_size: 2g
    tmpfs:
      - /tmp:mode=1777,exec

    ports:
      - ${RIDEALONG_BIND:-127.0.0.1}:${RIDEALONG_PORT:-6086}:6086
    # The long form, so a Windows path (C:\\...) works as a source. The CLI sets
    # RIDEALONG_FILES_INSIDE: the same path on Linux and macOS, a fixed one on Windows.
    volumes:
      - type: bind
        source: ${RIDEALONG_PROFILE}
        target: /profile
      - type: bind
        source: ${RIDEALONG_FILES}
        target: ${RIDEALONG_FILES_INSIDE:-/ridealong-files}
    # Agents reach the computer Ridealong runs on at this name (built in on Docker Desktop).
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      RIDEALONG_FILES: ${RIDEALONG_FILES_INSIDE:-/ridealong-files}
      RIDEALONG_FILES_HOST: ${RIDEALONG_FILES}
      RIDEALONG_HOST_OS: ${RIDEALONG_HOST_OS:-linux}
      RULES_FILE: /profile/ridealong-rules.json
      PUSH_FILE: /profile/ridealong-push.json
      RIDEALONG_RESOLUTION: ${RIDEALONG_RESOLUTION:-1920x1080}
      RIDEALONG_HOST_NETWORK: ${RIDEALONG_HOST_NETWORK:-0}
      VIEWER_HOST: 0.0.0.0
      VIEWER_PORT: 6086
      VIEWER_URL: ${RIDEALONG_URL:-}
      VIEWER_TOKEN: ${RIDEALONG_TOKEN:-}
      ALLOWED_HOSTS: ${RIDEALONG_ALLOWED_HOSTS:-}
      NOTIFY_URL: ${RIDEALONG_NOTIFY_URL:-}
      RIDEALONG_IDLE_HIDE_MIN: ${RIDEALONG_IDLE_HIDE_MIN:-15}
      RIDEALONG_IDLE_RELEASE_MIN: ${RIDEALONG_IDLE_RELEASE_MIN:-120}
      TZ: ${RIDEALONG_TZ:-UTC}
