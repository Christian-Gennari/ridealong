name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - name: Bridge
        run: node --test mcp/test/*.test.mjs
      - name: Syntax
        run: |
          node --check mcp/ridealong-mcp.mjs
          node --check ridealong-cursor/background.js
          node --check ridealong-cursor/cursor.js
      - name: Shell
        run: shellcheck --severity=warning docker/ridealong-mcp scripts/remove-host-install
      - name: Package
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            for (const need of ["ridealong", "cli/main.mjs", "compose.yaml", "docker/seccomp.json", "docs/agent-instructions.md"])
              if (!files.includes(need)) { console.error("missing from the package: " + need); process.exit(1); }
            if (files.some((f) => f.startsWith("cli/test/"))) { console.error("tests are in the package"); process.exit(1); }'

  # The command runs wherever agents do. Docker is faked here: GitHub's macOS and
  # Windows runners can't run Linux containers.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node ridealong help

  # The real image, booted by the real command, on both architectures. The second
  # amd64 run mounts the shared folder the way Windows does, to test path translation.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-latest
            files_inside: /ridealong-files
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/smoke.mjs
        env:
          RIDEALONG_FILES_INSIDE: ${{ matrix.files_inside }}
