name: Release
# Push a tag like v1.2.0 that matches package.json to publish the ridealong command to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      # No token: npm trusts this workflow (package settings, Trusted Publisher),
      # which needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version
      - run: npm publish --provenance --access public
